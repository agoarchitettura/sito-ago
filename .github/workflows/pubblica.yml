name: Pubblica il sito

# Ad ogni modifica del ramo main (anche dal pannello di modifica) il sito viene ricostruito e pubblicato.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24
        env:
          # Variabili del repository (Settings → Secrets and variables → Actions → Variables).
          # Per la prova: SITE_URL=https://agoarchitettura.github.io  SITE_BASE=/sito-ago  PUBLIC_NOINDEX=1
          # Per il sito definitivo: lasciarle vuote.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
