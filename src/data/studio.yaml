titolo: Chi siamo e come lavoriamo
introduzione: Ago Architettura è una società tra professionisti con sede a Macerata. Cinque soci fondatori lavorano insieme dal 2002; a loro si sono affiancati Giulia Terrè e Mattia Gigli. Seguiamo i progetti dal primo studio alla fine del cantiere. Con noi lavorano da anni ingegneri strutturisti, geologi, ingegneri impiantisti e altri specialisti, scelti secondo l'opera.
soci:
  - nome: Emanuele Zippilli
    testo: Architetto. Progetto e direzione lavori; restauro e consolidamento di edifici storici e monumentali. Membro esperto per i beni storico-culturali della Commissione Edilizia Specialistica del Comune di Macerata dal 2016 al 2023.
  - nome: Gabriele Cardarelli
    testo: Architetto. Progetto e direzione lavori architettonica e impiantistica; sicurezza nei cantieri; progettazione energetica. Certificatore di sostenibilità energetico-ambientale (Protocollo ITACA, elenco regionale delle Marche) e tecnico competente in acustica.
  - nome: Marta Massetani
    testo: Architetto. Restauro e consolidamento di edifici storici e monumentali; perfezionamento post-laurea in restauro architettonico e recupero edilizio, urbano e ambientale (Università Roma Tre); valutatore AeDES.
  - nome: Paolo Orlandi
    testo: Architetto. Progetto e direzione lavori; interior design; coordinamento della sicurezza nei cantieri.
  - nome: Pasquale Rinaldi
    testo: Architetto. Progetto e direzione lavori; progettazione energetica; allestimenti e spazi commerciali; interior design.
  - nome: Giulia Terrè
    testo: Architetto. Progetto e direzione lavori; BIM.
  - nome: Mattia Gigli
    testo: Architetto. Progetto e direzione lavori; BIM.
nota_soci: Siamo iscritti all'Ordine degli Architetti PPC di Macerata. Lo studio è iscritto all'elenco speciale dei professionisti per la ricostruzione post-sisma 2016.
metodo_introduzione: Teniamo al servizio del committente. Ogni incarico rispetta tempi e costi concordati, e comincia ascoltando.
metodo:
  - titolo: Ascoltiamo
    testo: Ogni lavoro parte dalle esigenze di chi lo commissiona. Usiamo questionari per raccogliere le informazioni e documenti di sintesi, con l'analisi di fattibilità e delle alternative possibili.
  - titolo: Lavoriamo in gruppo
    testo: "Per ogni incarico si forma un gruppo con collaboratori affidabili, che segue tutto il percorso: dal rilievo al collaudo."
  - titolo: Pianifichiamo e documentiamo
    testo: Teniamo i rapporti con tutti i soggetti coinvolti, archiviamo la documentazione e rispettiamo le scadenze. Su piattaforme condivise committenti, progettisti e imprese trovano documenti, comunicazioni e foto dell'avanzamento dei lavori.
cultura: "Per noi il progetto è ricerca, studio e pensiero, oltre alla pratica quotidiana di cantiere."
