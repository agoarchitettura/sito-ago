sottotitolo: Progetto, restauro e direzione lavori per enti pubblici e committenti privati. Insieme dal 2002.
fatti: Dal 2002 · sette architetti · Macerata
aree:
  - titolo: Opere pubbliche
    testo: "Fattibilità, progetto esecutivo, direzione lavori, sicurezza e collaudo per comuni e altri enti: edifici pubblici, impianti sportivi, spazi urbani e illuminazione."
  - titolo: Restauro e patrimonio storico
    testo: Restauro, consolidamento e miglioramento sismico di palazzi, ville, chiese ed edifici sotto tutela, anche dopo il sisma.
  - titolo: Nuova edificazione
    testo: Edifici residenziali, ricettivi e rurali, dal progetto alla direzione lavori, con attenzione a energia, acustica e sostenibilità.
chiusura_titolo: Parliamo del vostro progetto.
chiusura_testo: Siamo a Macerata, in via Roma 211. Scrivete a info@ago.archi o chiamate lo 0733 1991733.
