<figure class="grafico"><p class="etichetta">Energia e acqua</p><svg viewBox="0 0 560 400" role="img" aria-labelledby="gt3 gd3" xmlns="http://www.w3.org/2000/svg"><title id="gt3">Schema energetico</title><desc id="gd3">Tre percorsi: elettricità dal fotovoltaico alle batterie, calore dalla pompa di calore ai pannelli radianti, acqua piovana dalla cisterna agli usi domestici.</desc><defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="gk"/></marker></defs><text x="0" y="14" class="gm" font-size="13">ELETTRICITÀ</text><rect x="0" y="26" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="75" y="56" text-anchor="middle" class="gt" font-size="16">Fotovoltaico</text><text x="75" y="78" text-anchor="middle" class="gt" font-size="16">19 kWp</text><line x1="154" y1="61" x2="200" y2="61" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="205" y="26" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="280" y="56" text-anchor="middle" class="gt" font-size="16">Batterie</text><text x="280" y="78" text-anchor="middle" class="gt" font-size="16">di accumulo</text><line x1="359" y1="61" x2="405" y2="61" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="410" y="26" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="485" y="56" text-anchor="middle" class="gt" font-size="16">Alloggi e</text><text x="485" y="78" text-anchor="middle" class="gt" font-size="16">parti comuni</text><text x="560" y="14" text-anchor="end" class="gt" font-size="14" opacity=".8">in copertura</text><text x="0" y="164" class="gm" font-size="13">CALORE</text><rect x="0" y="176" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="75" y="206" text-anchor="middle" class="gt" font-size="16">Aria esterna</text><text x="75" y="228" text-anchor="middle" class="gt" font-size="16"></text><line x1="154" y1="211" x2="200" y2="211" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="205" y="176" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="280" y="206" text-anchor="middle" class="gt" font-size="16">Pompa di calore</text><text x="280" y="228" text-anchor="middle" class="gt" font-size="16">aria-acqua</text><line x1="359" y1="211" x2="405" y2="211" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="410" y="176" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="485" y="206" text-anchor="middle" class="gt" font-size="16">Pannelli radianti</text><text x="485" y="228" text-anchor="middle" class="gt" font-size="16">e acqua calda</text><text x="560" y="164" text-anchor="end" class="gt" font-size="14" opacity=".8">nessun impianto a gas</text><text x="0" y="314" class="gm" font-size="13">ACQUA</text><rect x="0" y="326" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="75" y="356" text-anchor="middle" class="gt" font-size="16">Pioggia</text><text x="75" y="378" text-anchor="middle" class="gt" font-size="16">sul tetto</text><line x1="154" y1="361" x2="200" y2="361" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="205" y="326" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="280" y="356" text-anchor="middle" class="gt" font-size="16">Cisterna di</text><text x="280" y="378" text-anchor="middle" class="gt" font-size="16">recupero, oltre 15 m³</text><line x1="359" y1="361" x2="405" y2="361" class="gs" stroke-width="2" marker-end="url(#fr)"/><rect x="410" y="326" width="150" height="70" class="gc gs" stroke-width="1.5"/><text x="485" y="356" text-anchor="middle" class="gt" font-size="16">Irrigazione e</text><text x="485" y="378" text-anchor="middle" class="gt" font-size="16">usi domestici</text></svg><ol class="leg"><li>Elettricità prodotta dal fotovoltaico, accumulata nelle batterie e usata dalle 15 unità e dalle parti comuni.</li><li>Riscaldamento a pannelli radianti e acqua calda sanitaria con pompe di calore aria-acqua, senza gas.</li><li>Acque meteoriche raccolte dal tetto, per irrigazione, scarichi dei servizi e lavaggio del bucato.</li></ol><figcaption>Edificio nZEB. Schema di principio.</figcaption></figure>
