<figure class="grafico energia"><p class="etichetta">Sole, acqua, consumi</p><div class="flusso"><div class="fh"><h4>Acqua calda</h4><p>dal sole</p></div><div class="nodi"><div class="nodo"><strong>Collettori sottovuoto</strong><span>30 m² su un'unica falda a sud, inclinata di 30°</span></div><span class="freccia" aria-hidden="true">→</span><div class="nodo"><strong>Acqua calda sanitaria</strong><span>a luglio 3.766 kWh prodotti contro 1.352 richiesti: il fabbisogno estivo è coperto per intero</span></div></div></div><div class="flusso"><div class="fh"><h4>Acqua</h4><p>dal tetto</p></div><div class="nodi"><div class="nodo"><strong>Pioggia</strong><span>165 m² di coperture, 640 mm l'anno: circa 105 m³ raccolti</span></div><span class="freccia" aria-hidden="true">→</span><div class="nodo"><strong>Cisterna</strong><span>prime piogge separate, filtro e disinfezione; riserva per luglio e agosto</span></div><span class="freccia" aria-hidden="true">→</span><div class="nodo"><strong>Una seconda rete</strong><span>cassette dei wc, lavatrici, lavastoviglie: 26,6 m³ l'anno per abitante, circa il 40% dell'acqua potabile</span></div></div></div><div class="flusso"><div class="fh"><h4>Consumi</h4><p>misurati</p></div><div class="nodi"><div class="nodo"><strong>Contatori in ogni alloggio</strong><span>acqua calda e fredda, calore, elettricità</span></div><span class="freccia" aria-hidden="true">→</span><div class="nodo"><strong>Telelettura</strong><span>una centralina per tutto l'edificio</span></div><span class="freccia" aria-hidden="true">→</span><div class="nodo"><strong>Indici di prestazione</strong><span>kWh per m² e per abitante, per correggere la gestione</span></div></div></div><figcaption>Schema di principio. Dati delle schede ITACA del progetto per dieci alloggi (Contratto di Quartiere II).</figcaption></figure>
